aid: mitra-chem
name: Mitra Chem
description: 'Mitra Chem is an AI-enabled innovator and manufacturer of battery and critical
  materials for energy, AI infrastructure and defense applications, founded in 2021 and
  headquartered in Mountain View, California. Its first commercial product is iron-based
  lithium iron phosphate (LFP) and lithium manganese iron phosphate (LMFP) cathode active
  material produced for Western battery cell makers and energy-storage OEMs as a non-China
  supply source. The company operates The Foundry, an instrumented shared pilot manufacturing
  facility spanning wet chemistry, hydrometallurgy, particle sizing, drying and heat treatment,
  and runs an internal full-stack AI platform of physics-based models, digital twins and
  engineering co-pilots used to compress materials scale-up cost and timelines. The AI platform
  is internal tooling for Mitra Chem''s own manufacturing operations; it is not sold or exposed
  as a software product, and the company publishes no public API, developer portal, SDK or
  machine-readable interface.'
